# Calendar popup, matching the audio and Wi-Fi panels. Colors use RRGGBBAA.
[main]
font=GoMono Nerd Font:size=10
namespace=calendar-menu
x-margin=12
y-margin=40
horizontal-pad=18
vertical-pad=18
inner-pad=12

[colors]
background=181825f2
text=cdd6f4ff
prompt=f9e2afff
input=cdd6f4ff
placeholder=7f849cff
selection=313244cc
selection-text=f9e2afff
border=cdd6f426

[border]
width=1
radius=12
selection-radius=8
