# Calendar popup, matching the audio and Wi-Fi panels. Colors use RRGGBBAA.
[main]
font=GoMono Nerd Font:size=10
namespace=calendar-menu
x-margin=12
y-margin=40
horizontal-pad=18
vertical-pad=18
inner-pad=12

[colors]
background=1e1e2e47
text=cdd6f4ff
prompt=b4befeff
input=cdd6f4ff
placeholder=a6adc8ff
selection=cba6f738
selection-text=cba6f7ff
border=ffffff29

[border]
width=1
radius=16
selection-radius=8
