name: Configuration checks
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dbus-daemon libfftw3-dev libpulse-dev libwayland-dev
      - name: Check shell scripts
        run: |
          bash -n setup.sh
          shellcheck setup.sh bin/* config/quickshell/*.sh config/hypr/wallpaper-start.sh
      - name: Test installer in isolated home directories
        run: /usr/bin/python3 -m unittest discover -s tests -v

  quickshell:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Bootstrap checkout tools
        run: pacman -Syu --needed --noconfirm git
      - uses: actions/checkout@v4
      - name: Install the complete native desktop dependency manifest
        shell: bash
        run: |
          mapfile -t packages < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' packages.txt)
          pacman -Syu --needed --noconfirm git "${packages[@]}"
      - name: Create a normal desktop test user
        run: useradd --create-home --shell /bin/bash hyprshell-test
      - name: Validate native runtime and Hyprland configuration
        run: |
          runuser -u hyprshell-test -- python3 tools/check_runtime.py --native
          runuser -u hyprshell-test -- Hyprland --verify-config --config "$PWD/config/hypr/hyprland.lua"
      - name: Exercise the installer as a normal user with system changes mocked
        run: runuser -u hyprshell-test -- python3 -m unittest discover -s tests -v
      - name: Compile the output spectrum helper
        run: cc -O2 config/quickshell/helpers/audio-spectrum.c -o config/quickshell/helpers/audio-spectrum -lpulse-simple -lpulse -lfftw3 -lm
      - name: Check QML components offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input config/quickshell/tests
      - name: Check native FFT and QML delivery
        run: python3 config/quickshell/tests/test_spectrum.py
